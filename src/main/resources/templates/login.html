<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 停车场智能管理系统</title>
    <script type="text/javascript" src="../js/jquery-1.8.3.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 20% 20%, #1e40af 0%, #0f172a 55%, #020617 100%);
        }

        .login-card {
            display: flex;
            width: 940px;
            max-width: 100%;
            min-height: 520px;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 40px 90px -30px rgba(2, 6, 23, .85);
            animation: rise .5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        /* ---------- 左侧品牌区 ---------- */
        .brand {
            flex: 1.08;
            padding: 44px 38px;
            color: #fff;
            background: linear-gradient(150deg, #1e3a8a 0%, #2563eb 60%, #0ea5e9 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .brand::after {
            content: "";
            position: absolute;
            right: -70px;
            bottom: -80px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .09);
        }

        .brand-logo {
            font-size: 40px;
            margin-bottom: 14px;
        }

        .brand h1 {
            font-size: 25px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .brand-sub {
            font-size: 12.5px;
            opacity: .75;
            letter-spacing: .5px;
            margin-bottom: 30px;
        }

        .brand-features {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .brand-features li {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .brand-features li span {
            flex: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .16);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .brand-features b {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .brand-features i {
            font-style: normal;
            font-size: 12.5px;
            opacity: .8;
        }

        .brand-foot {
            margin-top: auto;
            padding-top: 26px;
            font-size: 12px;
            opacity: .7;
            position: relative;
            z-index: 1;
        }

        /* ---------- 右侧表单区 ---------- */
        .panel {
            flex: 1;
            padding: 48px 42px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel h2 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .panel-sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 14px;
            color: #1f2937;
            font-family: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }

        .btn-login {
            width: 100%;
            height: 44px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 3px;
            cursor: pointer;
            font-family: inherit;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -12px rgba(37, 99, 235, .9);
        }

        .btn-login:disabled {
            opacity: .7;
            cursor: default;
        }

        .btn-register {
            width: 100%;
            height: 42px;
            margin-top: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all .2s;
        }

        .btn-register:hover {
            background: #eff6ff;
            border-color: #2563eb;
        }

        .panel-foot {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }

        /* 窄屏：藏掉品牌区，只留表单 */
        @media (max-width: 860px) {
            .login-card {
                width: 400px;
                min-height: auto;
            }

            .brand {
                display: none;
            }

            .panel {
                padding: 36px 26px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- 左侧：品牌与亮点 -->
    <div class="brand">
        <div class="brand-logo">🅿️</div>
        <h1>停车场智能管理系统</h1>
        <p class="brand-sub">SMART PARKING MANAGEMENT SYSTEM</p>

        <ul class="brand-features">
            <li>
                <span>📷</span>
                <div>
                    <b>车牌识别入场</b>
                    <i>拍照即录入，AI 自动填入车牌号</i>
                </div>
            </li>
            <li>
                <span>🤖</span>
                <div>
                    <b>AI 业务助手</b>
                    <i>自然语言查空位、算费用、问会员</i>
                </div>
            </li>
            <li>
                <span>⚡</span>
                <div>
                    <b>Redis 车位缓存</b>
                    <i>出入口状态实时同步，秒级刷新</i>
                </div>
            </li>
        </ul>

        <div class="brand-foot">管理员 / 会员 / 普通用户 · 三角色独立工作台</div>
    </div>

    <!-- 右侧：登录表单 -->
    <div class="panel">
        <h2>登录</h2>
        <p class="panel-sub">输入账号密码，进入对应工作台</p>

        <div class="field">
            <label>账号</label>
            <input type="text" name="username" placeholder="请输入账号" autocomplete="username">
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" autocomplete="current-password">
        </div>

        <button class="btn-login" id="btnLogin">登 录</button>
        <button class="btn-register" id="btnRegister">注册新账号</button>

        <div class="panel-foot">忘记密码请联系管理员重置</div>
    </div>
</div>

<script type="text/javascript" src="../js/toast.js"></script>
<script>
    (function () {
        function doLogin() {
            var username = $('[name=username]').val().trim();
            var password = $('[name=password]').val();
            if (!username) {
                toast('请输入账号', 'err');
                return;
            }
            if (!password) {
                toast('请输入密码', 'err');
                return;
            }

            var $btn = $('#btnLogin').prop('disabled', true).text('登录中…');
            $.post('SysUser/doLogin', {username: username, password: password}, function (data) {
                if (data && data.bool) {
                    var role = data.t.role;
                    var target = role === '管理员' ? 'dashboard.html'
                        : (role === '会员' ? 'memberCenter.html' : 'userSpots.html');
                    toast('登录成功，正在进入' + (role || '') + '工作台');
                    setTimeout(function () {
                        window.location.href = target + '?username=' + encodeURIComponent(username);
                    }, 400);
                } else {
                    toast('账号或密码错误，请重试', 'err');
                    $btn.prop('disabled', false).text('登 录');
                }
            }).fail(function () {
                toast('网络异常，请稍后重试', 'err');
                $btn.prop('disabled', false).text('登 录');
            });
        }

        $(document).ready(function () {
            $('#btnLogin').click(doLogin);
            $('#btnRegister').click(function () {
                window.location.href = 'register.html';
            });
            // 回车直接登录
            $('[name=password], [name=username]').on('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doLogin();
                }
            });
        });
    })();
</script>
</body>
</html>
