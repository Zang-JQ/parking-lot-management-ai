<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车位管理 - 停车场管理系统</title>
    <script type="text/javascript" src="../js/jquery-1.8.3.js"></script>
    <script>
        $(document).ready(function () {
            // ===== 自动高亮当前导航项（点谁谁变色，其他还原）=====
            var currentPath = window.location.pathname;
            var currentPage = currentPath.substring(currentPath.lastIndexOf('/') + 1).split('?')[0];
            var navMap = {
                'dashboard.html': 'li1',
                'spots.html': 'li2',
                'rules.html': 'li3',
                'records.html': 'li4',
                'members.html': 'li5',
                'reports.html': 'li6',
                'settings.html': 'li7'
            };
            if (navMap[currentPage]) {
                $("[name=" + navMap[currentPage] + "] a").addClass("active");
            }

            const params = new URLSearchParams(window.location.search);
            const username = params.get('username');
            let userid = null; // 提升到外层作用域         // 侧边栏页面跳转
            function bindSideBar(){
                $("[name=li1]").click(function () {
                    window.location.href = "dashboard.html?username="+username;
                })
                $("[name=li2]").click(function () {
                    window.location.href = "spots.html?username="+username;
                })
                $("[name=li3]").click(function () {
                    window.location.href = "rules.html?username="+username;
                })
                $("[name=li4]").click(function () {
                    window.location.href = "records.html?username="+username;
                })
                $("[name=li5]").click(function () {
                    window.location.href = "members.html?username="+username;
                })
                $("[name=li6]").click(function () {
                    window.location.href = "reports.html?username="+username;
                })
                $("[name=li7]").click(function () {
                    window.location.href = "settings.html?username="+username;
                })
            }
            bindSideBar();
        })
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        input, select, textarea {
            font-family: inherit;
        }

        .topbar {
            height: 60px;
            background: #1e3a8a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .topbar .logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .topbar .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
        }

        .topbar .user-info .role-tag {
            background: #3b82f6;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            display: inline-block;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .main-layout {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        .sidebar {
            width: 220px;
            background: #1e293b;
            flex-shrink: 0;
        }

        .sidebar ul {
            list-style: none;
            padding-top: 10px;
        }

        .sidebar li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            color: #cbd5e1;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all .2s;
        }

        .sidebar li a:hover {
            background: #334155;
            color: #fff;
        }

        .sidebar li a.active {
            background: #3b82f6;
            color: #fff;
            border-left-color: #fff;
        }

        .sidebar li .icon {
            width: 18px;
            text-align: center;
        }

        .content {
            flex: 1;
            padding: 24px;
        }

        .page-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }

        .toolbar {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            display: inline-block;
            cursor: default;
        }

        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        thead {
            background: #f8fafc;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            color: #475569;
            font-weight: 600;
        }

        tbody tr:hover {
            background: #f0f9ff;
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .tag-green {
            background: #f0fdf4;
            color: #22c55e;
            border: 1px solid #bbf7d0;
        }

        .tag-red {
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
        }

        .tag-orange {
            background: #fff7ed;
            color: #f97316;
            border: 1px solid #fed7aa;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="../css/app.css">
</head>
<body>

<div class="topbar">
    <div class="logo">🅿️ 停车场管理系统</div>
    <div class="user-info">
        <span>系统管理员</span>
        <span class="role-tag">管理员</span>
        <a href="SysUser/logout" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="main-layout">
    <div class="sidebar">
        <ul>
            <li name="li1"><a><span class="icon">📊</span><span>首页仪表盘</span></a></li>
            <li name="li2"><a><span class="icon">🅿️</span><span>车位管理</span></a></li>
            <li name="li3"><a><span class="icon">💰</span><span>费率规则管理</span></a></li>
            <li name="li4"><a><span class="icon">📋</span><span>停车记录查询</span></a></li>
            <li name="li5"><a><span class="icon">💳</span><span>会员管理</span></a></li>
            <li name="li6"><a><span class="icon">📈</span><span>收费统计报表</span></a></li>
            <li name="li7"><a><span class="icon">⚙️</span><span>系统设置</span></a></li>
        </ul>
    </div>

    <div class="content">
        <h2 class="page-title">车位管理</h2>

        <div class="toolbar">
            <div class="spot-tabs" id="statusTabs">
                <button type="button" class="active" data-status="all">全部<b name="cntAll">0</b></button>
                <button type="button" data-status="空闲">空闲<b name="cntFree">0</b></button>
                <button type="button" data-status="已占用">已占用<b name="cntUsed">0</b></button>
                <button type="button" data-status="维修中">维修中<b name="cntRepair">0</b></button>
            </div>
            <button type="button" class="btn btn-primary" id="btnAdd">+ 新增车位</button>
            <button type="button" class="btn btn-default" id="btnRefresh">刷新</button>
            <span class="chart-sub" name="updatedAt"></span>
        </div>

        <div class="spot-grid" id="spotGrid"></div>

        <div class="spot-legend">
            <span><i style="background:#22c55e"></i>空闲</span>
            <span><i style="background:#ef4444"></i>已占用</span>
            <span><i style="background:#f59e0b"></i>维修中</span>
        </div>
    </div>
</div>

<!-- 新增 / 编辑车位的弹窗 -->
<div class="modal-mask" id="spotModal">
    <div class="modal">
        <div class="modal-head">
            <h3 id="modalTitle">新增车位</h3>
            <button type="button" class="modal-close" id="btnClose">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>车位编号</label>
                <input type="text" id="mCode" maxlength="10" placeholder="如 A007">
            </div>
            <div class="form-group">
                <label>车位类型</label>
                <select id="mType">
                    <option value="普通">普通</option>
                    <option value="会员">会员</option>
                </select>
            </div>
            <div class="form-group">
                <label>车位状态</label>
                <select id="mStatus">
                    <option value="空闲">空闲</option>
                    <option value="已占用">已占用（手动锁定 / 预留）</option>
                    <option value="维修中">维修中</option>
                </select>
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" id="mRemark" maxlength="50" placeholder="选填，如：靠近入口">
            </div>
            <div class="chart-sub" id="mHint" style="line-height:1.7;"></div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-danger" id="btnDelete" style="display:none;">删除</button>
            <span style="flex:1"></span>
            <button class="btn btn-default" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<script type="text/javascript" src="../js/toast.js"></script>
<script>
    (function () {
        var allSpots = [];
        var filter = 'all';

        function countOf(status) {
            return allSpots.filter(function (s) { return s.status === status; }).length;
        }

        function render() {
            var list = allSpots.filter(function (s) {
                return filter === 'all' || s.status === filter;
            });
            var $grid = $('#spotGrid').empty();
            if (list.length === 0) {
                $grid.append('<div class="spot-empty">该状态下没有车位</div>');
                return;
            }
            list.forEach(function (s) {
                var cls = s.status === '空闲' ? 'free' : (s.status === '已占用' ? 'used' : 'repair');
                var $cell = $('<div class="spot-cell ' + cls + '"></div>')
                    .attr('title', s.spotcode + ' · ' + s.status + (s.platenumber ? ' · ' + s.platenumber : ''));
                $cell.append('<div class="cell-code">' + s.spotcode
                    + '<span class="spot-type-tag">' + s.spottype + '</span></div>');
                $cell.append('<div class="cell-status">' + s.status + '</div>');
                if (s.status === '已占用') {
                    if (s.platenumber) {
                        $cell.append('<div class="cell-plate">' + s.platenumber + '</div>');
                        if (s.entrytime) {
                            var h = Math.floor(s.minutes / 60);
                            var m = s.minutes % 60;
                            $cell.append('<div class="cell-time">已停 ' + (h > 0 ? h + ' 小时 ' + m + ' 分' : m + ' 分钟') + '</div>');
                        }
                    } else {
                        $cell.append('<div class="cell-plate" style="color:#b45309;">手动锁定</div>');
                    }
                } else if (s.remark && s.remark !== '-') {
                    $cell.append('<div class="cell-time">' + s.remark + '</div>');
                }
                $cell.on('click', function () { openModal(s); });
                $grid.append($cell);
            });
        }

        function load() {
            fetch('ParkingSpot/grid')
                .then(function (r) { return r.json(); })
                .then(function (list) {
                    allSpots = list || [];
                    $('[name=cntAll]').text(allSpots.length);
                    $('[name=cntFree]').text(countOf('空闲'));
                    $('[name=cntUsed]').text(countOf('已占用'));
                    $('[name=cntRepair]').text(countOf('维修中'));
                    $('[name=updatedAt]').text('更新于 ' + new Date().toLocaleTimeString());
                    render();
                })
                .catch(function () {
                    $('[name=updatedAt]').text('加载失败');
                });
        }

        /* ---------- 新增 / 编辑弹窗 ---------- */
        var editing = null;   // null 表示新增

        function openModal(spot) {
            editing = spot || null;
            $('#modalTitle').text(spot ? '编辑车位 ' + spot.spotcode : '新增车位');
            $('#mCode').val(spot ? spot.spotcode : '').prop('disabled', !!spot);
            $('#mType').val(spot ? spot.spottype : '普通');
            $('#mStatus').val(spot ? spot.status : '空闲');
            $('#mRemark').val(spot && spot.remark && spot.remark !== '-' ? spot.remark : '');
            $('#btnDelete').toggle(!!spot);

            // 只有「真有车停着」才锁状态；管理员手动标的占用可以随时改回来
            var occupiedByCar = !!(spot && spot.platenumber);
            if (occupiedByCar) {
                $('#mStatus').prop('disabled', true);
                $('#mHint').text('该车位有车辆（' + spot.platenumber + '）在场，状态由系统维护，出场后才能修改。');
            } else {
                $('#mStatus').prop('disabled', false);
                $('#mHint').text(spot
                    ? '改成「已占用」相当于把车位锁定，入场页不会再列出它。'
                    : '编号建议用字母前缀 + 数字，例如 A007。');
            }

            $('#spotModal').addClass('open');
            if (!spot) {
                $('#mCode').focus();
            }
        }

        function closeModal() {
            $('#spotModal').removeClass('open');
            $('#mCode').prop('disabled', false);
            $('#mStatus').prop('disabled', false);
        }

        function submitModal() {
            var payload = {
                spotcode: $('#mCode').val().trim(),
                spottype: $('#mType').val(),
                status: $('#mStatus').val(),
                remark: $('#mRemark').val().trim()
            };
            if (!payload.spotcode) {
                toast('请填写车位编号', 'err');
                return;
            }
            var url = editing ? 'ParkingSpot/update' : 'ParkingSpot/add';
            $.post(url, $.param(payload), function (res) {
                if (res && res.success) {
                    toast(res.message);
                    closeModal();
                    load();
                } else {
                    toast((res && res.message) || '保存失败', 'err');
                }
            }).fail(function () {
                toast('提交失败，请检查网络', 'err');
            });
        }

        function removeSpot() {
            if (!editing) {
                return;
            }
            if (!confirm('确定删除车位 ' + editing.spotcode + ' 吗？')) {
                return;
            }
            $.post('ParkingSpot/delete', {spotcode: editing.spotcode}, function (res) {
                if (res && res.success) {
                    toast(res.message);
                    closeModal();
                    load();
                } else {
                    toast((res && res.message) || '删除失败', 'err');
                }
            }).fail(function () {
                toast('提交失败，请检查网络', 'err');
            });
        }

        $(document).ready(function () {
            // 当前菜单高亮
            var currentPage = window.location.pathname.split('/').pop().split('?')[0];
            var navMap = {
                'dashboard.html': 'li1', 'spots.html': 'li2', 'rules.html': 'li3',
                'records.html': 'li4', 'members.html': 'li5', 'reports.html': 'li6', 'settings.html': 'li7'
            };
            if (navMap[currentPage]) {
                $("[name=" + navMap[currentPage] + "] a").addClass("active");
            }

            // 侧边栏跳转（原来这个页面根本没绑点击事件）
            var username = new URLSearchParams(window.location.search).get('username') || '';
            var targets = {
                li1: 'dashboard', li2: 'spots', li3: 'rules', li4: 'records',
                li5: 'members', li6: 'reports', li7: 'settings'
            };
            Object.keys(targets).forEach(function (li) {
                $('[name=' + li + ']').click(function () {
                    window.location.href = targets[li] + '.html?username=' + encodeURIComponent(username);
                });
            });

            $('#statusTabs').on('click', 'button', function () {
                filter = $(this).attr('data-status');
                $('#statusTabs button').removeClass('active');
                $(this).addClass('active');
                render();
            });
            $('#btnRefresh').click(load);
            $('#btnAdd').click(function () { openModal(null); });
            $('#btnClose, #btnCancel').click(closeModal);
            $('#btnSave').click(submitModal);
            $('#btnDelete').click(removeSpot);
            $('#spotModal').on('click', function (e) {
                if (e.target === this) {
                    closeModal();
                }
            });

            load();

            // 演示用：spots.html?username=root#add 直接弹出新增框
            if (window.location.hash === '#add') {
                setTimeout(function () { openModal(null); }, 300);
            }
            setInterval(load, 30000);
        });
    })();
</script>
</body>
</html>
