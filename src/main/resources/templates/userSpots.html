<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车位查询 - 停车场管理系统</title>
    <script type="text/javascript" src="../js/jquery-1.8.3.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            // ===== 自动高亮当前导航项（点谁谁变色，其他还原）=====
            var currentPath = window.location.pathname;
            var currentPage = currentPath.substring(currentPath.lastIndexOf('/') + 1).split('?')[0];
            var navMap = {
                'userSpots.html': 'li1',
                'userEntry.html': 'li2',
                'userExit.html': 'li3',
                'userRecords.html': 'li4',
                'userMembership.html': 'li5'
            };
            if (navMap[currentPage]) {
                $("[name=" + navMap[currentPage] + "] a").addClass("active");
            }

            const params = new URLSearchParams(window.location.search);
            const username = params.get('username');
            let userid = null; // 提升到外层作用域
            // 侧边栏跳转
            $("[name=li1]").click(function () {
                window.location.href = "userSpots.html?username="+username;
            })
            $("[name=li2]").click(function () {
                window.location.href = "userEntry.html?username="+username;
            })
            $("[name=li3]").click(function () {
                window.location.href = "userExit.html?username="+username;
            })
            $("[name=li4]").click(function () {
                window.location.href = "userRecords.html?username="+username;
            })
            $("[name=li5]").click(function () {
                window.location.href = "userMembership.html?username="+username;
            })
            $.get("SysUser/findByUsername",{"username":username},function(data){
                $("[name=realname]").text(data.t.realname);
            })
            $.get("ParkingSpot/findAll",function (data) {
                JSON.stringify(data);
                $("tbody").empty();
                for (let i = 0; i < data.length; i++) {
                    let spanStyle = "";
                    if(data[i].status === "空闲"){
                        spanStyle = "color:#28a745;border:1px solid #28a745;padding:2px 6px;display:inline-block;border-radius:4px;";
                    }else if(data[i].status === "已占用"){
                        spanStyle = "color:#dc3545;border:1px solid #dc3545;padding:2px 6px;display:inline-block;border-radius:4px;";
                    }else if(data[i].status === "维修中"){
                        spanStyle = "color:#ffc107;border:1px solid #ffc107;padding:2px 6px;display:inline-block;border-radius:4px;";
                    }
                    $("<tr>\n" +
                        "<td>"+data[i].spotcode+"</td>\n" +
                        "<td>"+data[i].spottype+"</td>\n" +
                        "<td><span style='"+spanStyle+"'>"+data[i].status+"</span></td>\n" +
                        "<td>"+data[i].remark+"</td>\n" +
                    "</tr>").appendTo("tbody");
                }
            })


        });

    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        input, select, textarea {
            font-family: inherit;
        }

        .topbar {
            height: 60px;
            background: #0ea5e9;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .topbar .logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .topbar .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
        }

        .topbar .user-info .role-tag {
            background: #0369a1;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            display: inline-block;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .main-layout {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        .sidebar {
            width: 220px;
            background: #1e293b;
            flex-shrink: 0;
        }

        .sidebar ul {
            list-style: none;
            padding-top: 10px;
        }

        .sidebar li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            color: #cbd5e1;
            font-size: 14px;
            border-left: 3px solid transparent;
            transition: all .2s;
        }

        .sidebar li a:hover {
            background: #334155;
            color: #fff;
        }

        .sidebar li a.active {
            background: #0ea5e9;
            color: #fff;
            border-left-color: #fff;
        }

        .sidebar li .icon {
            width: 18px;
            text-align: center;
        }

        .content {
            flex: 1;
            padding: 24px;
        }

        .page-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
            border-left: 4px solid #0ea5e9;
            padding-left: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        thead {
            background: #f8fafc;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            color: #475569;
            font-weight: 600;
        }

        tbody tr:hover {
            background: #f0f9ff;
        }


        .spot-tip {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #0369a1;
        }
    </style>
    <link rel="stylesheet" type="text/css" href="../css/app.css">
</head>
<body>

<div class="topbar">
    <div class="logo">🅿️ 停车场管理系统</div>
    <div class="user-info">
        <span name="realname"></span>
        <span class="role-tag">普通用户</span>
        <a href="SysUser/logout" class="logout-btn">退出登录</a>
    </div>
</div>

<div class="main-layout">
    <div class="sidebar">
        <ul>
            <li name="li1"><a><span>🅿️</span><span>车位查询</span></a></li>
            <li name="li2"><a><span>➡️</span><span>车辆入场登记</span></a></li>
            <li name="li3"><a><span>⬅️</span><span>车辆出场结算</span></a></li>
            <li name="li4"><a><span>📋</span><span>我的停车记录</span></a></li>
            <li name="li5"><a><span>💳</span><span>充值会员</span></a></li>
        </ul>
    </div>

    <div class="content">
        <h2 class="page-title">车位查询</h2>
        <div class="spot-tip">💡
            以下为当前停车场实时车位状态，绿色为空闲可用，红色为已占用，橙色为维修中。入场登记时请选择空闲车位。
        </div>
        <table>
            <thead>
            <tr>
                <th>车位编号</th>
                <th>车位类型</th>
                <th>车位状态</th>
                <th>备注</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="text/javascript" src="../js/assistant.js"></script>
</body>
</html>
