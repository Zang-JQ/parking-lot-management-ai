<!-- 顶部导航栏 -->
<div class="topbar">
    <div class="logo">🅿️ 停车场管理系统</div>
    <div class="user-info">
        <span>系统管理员</span>

<script type="text/javascript" src="../js/jquery-1.8.3.js"></script>
<script>
    $(document).ready(function () {
        // ===== 自动高亮当前导航项（点谁谁变色，其他还原）=====
        var currentPath = window.location.pathname;
        var currentPage = currentPath.substring(currentPath.lastIndexOf('/') + 1).split('?')[0];
        var navMap = {
            'dashboard.html': 'li1',
            'spots.html': 'li2',
            'rules.html': 'li3',
            'records.html': 'li4',
            'members.html': 'li5',
            'reports.html': 'li6',
            'settings.html': 'li7'
        };
        if (navMap[currentPage]) {
            $("[name=" + navMap[currentPage] + "] a").addClass("active");
        }

        const params = new URLSearchParams(window.location.search);
        const username = params.get('username');
        let userid = null; // 提升到外层作用域         // 侧边栏页面跳转
        function bindSideBar(){
            $("[name=li1]").click(function () {
                window.location.href = "dashboard.html?username="+username;
            })
            $("[name=li2]").click(function () {
                window.location.href = "spots.html?username="+username;
            })
            $("[name=li3]").click(function () {
                window.location.href = "rules.html?username="+username;
            })
            $("[name=li4]").click(function () {
                window.location.href = "records.html?username="+username;
            })
            $("[name=li5]").click(function () {
                window.location.href = "members.html?username="+username;
            })
            $("[name=li6]").click(function () {
                window.location.href = "reports.html?username="+username;
            })
            $("[name=li7]").click(function () {
                window.location.href = "settings.html?username="+username;
            })
        }
        bindSideBar();
    })
</script>


<div class="main-layout">
    <!-- 左侧侧边菜单 -->
    <div class="sidebar">
        <ul>
            <li name="li1"><a><span class="icon">📊</span><span>首页仪表盘</span></a></li>
            <li name="li2"><a><span class="icon">🅿️</span><span>车位管理</span></a></li>
            <li name="li3"><a><span class="icon">💰</span><span>费率规则管理</span></a></li>
            <li name="li4"><a><span class="icon">📋</span><span>停车记录查询</span></a></li>
            <li name="li5"><a><span class="icon">💳</span><span>会员管理</span></a></li>
            <li name="li6"><a><span class="icon">📈</span><span>收费统计报表</span></a></li>
            <li name="li7"><a><span class="icon">⚙️</span><span>系统设置</span></a></li>
        </ul>
    </div>

    <!-- 右侧主内容区 -->
    <div class="content">
        <h2 class="page-title">首页仪表盘</h2>
        <!-- 4 个统计卡片：数据全部来自 Dashboard/summary 实时统计 -->
        <div class="stat-cards">
            <div class="stat-card blue">
                <div class="label">当前在场车辆</div>
                <div class="value" name="parkingNow">-</div>
            </div>
            <div class="stat-card green">
                <div class="label">空闲车位</div>
                <div class="value" name="freeSpots">-</div>
            </div>
            <div class="stat-card red">
                <div class="label">已占用车位</div>
                <div class="value" name="usedSpots">-</div>
            </div>
            <div class="stat-card orange">
                <div class="label">今日总收入(元)</div>
                <div class="value" name="todayIncome">-</div>
            </div>
        </div>

        <div class="dash-grid">
            <div class="chart-box">
                <h3>近 7 天收入趋势<span class="chart-sub" name="weekSum"></span></h3>
                <div id="incomeChart" class="chart-canvas"></div>
            </div>
            <div class="chart-box">
                <h3>车位状态分布<span class="chart-sub" name="totalSpots"></span></h3>
                <div id="spotChart" class="chart-canvas"></div>
                <div id="spotLegend" class="chart-legend"></div>
            </div>
        </div>

        <div class="chart-box" style="margin-top:14px;">
            <h3>实时在场车辆<span class="chart-sub" name="updatedAt"></span></h3>
            <table>
                <thead>
                <tr>
                    <th>车牌号</th>
                    <th>车位</th>
                    <th>入场时间</th>
                    <th>已停时长</th>
                </tr>
                </thead>
                <tbody name="carBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="text/javascript" src="../js/mini-chart.js"></script>
<script>
    (function () {
        function money(v) {
            return Number(v || 0).toFixed(2);
        }

        function load() {
            fetch('Dashboard/summary')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    $('[name=parkingNow]').text(d.parkingNow);
                    $('[name=freeSpots]').text(d.freeSpots);
                    $('[name=usedSpots]').text(d.usedSpots);
                    $('[name=todayIncome]').text(money(d.todayIncome));
                    $('[name=totalSpots]').text('共 ' + d.totalSpots + ' 个');

                    var series = d.last7days || [];
                    var sum = 0;
                    series.forEach(function (x) { sum += (x.amount || 0); });
                    $('[name=weekSum]').text('7 天合计 ¥' + money(sum));
                    MiniChart.line(document.getElementById('incomeChart'), series.map(function (x) {
                        return {label: x.label, value: x.amount || 0};
                    }), {color: '#3b82f6'});

                    var parts = [
                        {label: '空闲', value: d.freeSpots, color: '#22c55e'},
                        {label: '已占用', value: d.usedSpots, color: '#ef4444'},
                        {label: '维修中', value: d.repairSpots, color: '#f59e0b'}
                    ];
                    MiniChart.donut(document.getElementById('spotChart'), parts, {center: '个车位'});
                    MiniChart.legend(document.getElementById('spotLegend'), parts, '个');

                    var $body = $('[name=carBody]').empty();
                    if (!d.activeCars || d.activeCars.length === 0) {
                        $("<tr><td colspan='4' class='empty-row'>当前没有在场车辆</td></tr>").appendTo($body);
                    } else {
                        d.activeCars.forEach(function (c) {
                            var h = Math.floor(c.minutes / 60);
                            var m = c.minutes % 60;
                            var dur = h > 0 ? h + ' 小时 ' + m + ' 分钟' : m + ' 分钟';
                            $('<tr><td>' + c.platenumber + '</td><td>' + c.spotcode + '</td><td>'
                                + c.entrytime + '</td><td>' + dur + '</td></tr>').appendTo($body);
                        });
                    }
                    $('[name=updatedAt]').text('更新于 ' + new Date().toLocaleTimeString());
                })
                .catch(function () {
                    $('[name=updatedAt]').text('数据加载失败');
                });
        }

        $(document).ready(function () {
            load();
            // 30 秒自动刷新一次，演示时数字会自己动
            setInterval(load, 30000);
        });
    })();
</script>
