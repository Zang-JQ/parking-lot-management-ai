<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 - 停车场管理系统</title>
    <script type="text/javascript" src="../js/jquery-1.8.3.js"></script>
    <script>
        $(document).ready(function () {
            // ===== 自动高亮当前导航项（点谁谁变色，其他还原）=====
            var currentPath = window.location.pathname;
            var currentPage = currentPath.substring(currentPath.lastIndexOf('/') + 1).split('?')[0];
            var navMap = {
                'dashboard.html': 'li1',
                'spots.html': 'li2',
                'rules.html': 'li3',
                'records.html': 'li4',
                'members.html': 'li5',
                'reports.html': 'li6',
                'settings.html': 'li7'
            };
            if (navMap[currentPage]) {
                $("[name=" + navMap[currentPage] + "] a").addClass("active");
            }

            const params = new URLSearchParams(window.location.search);
            const username = params.get('username');
            let userid = null; // 提升到外层作用域         // 侧边栏页面跳转
            function bindSideBar(){
                $("[name=li1]").click(function () {
                    window.location.href = "dashboard.html?username="+username;
                })
                $("[name=li2]").click(function () {
                    window.location.href = "spots.html?username="+username;
                })
                $("[name=li3]").click(function () {
                    window.location.href = "rules.html?username="+username;
                })
                $("[name=li4]").click(function () {
                    window.location.href = "records.html?username="+username;
                })
                $("[name=li5]").click(function () {
                    window.location.href = "members.html?username="+username;
                })
                $("[name=li6]").click(function () {
                    window.location.href = "reports.html?username="+username;
                })
                $("[name=li7]").click(function () {
                    window.location.href = "settings.html?username="+username;
                })
            }
            bindSideBar();
        })
    </script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif; background: #f0f2f5; color: #333; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  .topbar {
    height: 60px; background: #1e3a8a; color: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 100;
  }
  .topbar .logo { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  .topbar .user-info { display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .topbar .user-info .role-tag { background: #3b82f6; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .logout-btn {
    background: #ef4444; color: #fff; border: none; padding: 6px 16px; border-radius: 4px;
    font-size: 13px; display: inline-block;
  }
  .logout-btn:hover { background: #dc2626; }

  .main-layout { display: flex; min-height: calc(100vh - 60px); }
  .sidebar { width: 220px; background: #1e293b; flex-shrink: 0; }
  .sidebar ul { list-style: none; padding-top: 10px; }
  .sidebar li a {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 24px; color: #cbd5e1; font-size: 14px;
    border-left: 3px solid transparent; transition: all .2s;
  }
  .sidebar li a:hover { background: #334155; color: #fff; }
  .sidebar li a.active { background: #3b82f6; color: #fff; border-left-color: #fff; }
  .sidebar li .icon { width: 18px; text-align: center; }

  .content { flex: 1; padding: 24px; }
  .page-title { font-size: 20px; margin-bottom: 20px; color: #333; border-left: 4px solid #3b82f6; padding-left: 12px; }

  .setting-card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 700px; margin-bottom: 24px; }
  .setting-card h3 { margin-bottom: 18px; color: #1e3a8a; font-size: 16px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; }
  .btn { padding: 8px 16px; border: none; border-radius: 4px; font-size: 13px; display: inline-block; cursor: default; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  thead { background: #f8fafc; }
  th, td { padding: 12px 14px; text-align: left; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
  th { color: #475569; font-weight: 600; }
  tbody tr:hover { background: #f0f9ff; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .tag-green { background: #f0fdf4; color: #22c55e; border: 1px solid #bbf7d0; }
  .tag-red { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; }
</style>
    <link rel="stylesheet" type="text/css" href="../css/app.css">
</head>
<body>

<div class="topbar">
  <div class="logo">🅿️ 停车场管理系统</div>
  <div class="user-info">
    <span>系统管理员</span>
    <span class="role-tag">管理员</span>
    <a href="SysUser/logout" class="logout-btn">退出登录</a>
  </div>
</div>

<div class="main-layout">
  <div class="sidebar">
    <ul>
        <li name="li1"><a><span class="icon">📊</span><span>首页仪表盘</span></a></li>
        <li name="li2"><a><span class="icon">🅿️</span><span>车位管理</span></a></li>
        <li name="li3"><a><span class="icon">💰</span><span>费率规则管理</span></a></li>
        <li name="li4"><a><span class="icon">📋</span><span>停车记录查询</span></a></li>
        <li name="li5"><a><span class="icon">💳</span><span>会员管理</span></a></li>
        <li name="li6"><a><span class="icon">📈</span><span>收费统计报表</span></a></li>
        <li name="li7"><a><span class="icon">⚙️</span><span>系统设置</span></a></li>
    </ul>
  </div>

  <div class="content">
    <h2 class="page-title">系统设置</h2>

    <!-- 只读展示：数据来自 syssetting 表 -->
    <div class="setting-card">
      <h3>基本参数<span class="chart-sub" name="updatedAt"></span></h3>
      <div class="info-list">
        <div class="info-row"><span class="k">停车场名称</span><span class="v" name="parkingname">-</span></div>
        <div class="info-row"><span class="k">总车位数</span><span class="v" name="totalspots">-</span></div>
        <div class="info-row"><span class="k">免费停车时长</span><span class="v" name="freeminutes">-</span></div>
        <div class="info-row"><span class="k">联系电话</span><span class="v" name="contactphone">-</span></div>
        <div class="info-row"><span class="k">停车场地址</span><span class="v" name="address">-</span></div>
      </div>
      <div class="chart-sub" style="margin-top:12px;line-height:1.8;">
        本页仅做数据展示，不提供修改入口。参数存放在 syssetting 表，计费相关参数以「费率规则管理」页为准。
      </div>
    </div>

    <!-- 只读展示：实时车位使用情况 -->
    <div class="setting-card" style="margin-top:14px;">
      <h3>车位使用情况<span class="chart-sub">实时统计</span></h3>
      <div class="info-list">
        <div class="info-row"><span class="k">车位总数</span><span class="v" name="spotTotal">-</span></div>
        <div class="info-row"><span class="k">空闲</span><span class="v" name="spotFree">-</span></div>
        <div class="info-row"><span class="k">已占用</span><span class="v" name="spotUsed">-</span></div>
        <div class="info-row"><span class="k">维修中</span><span class="v" name="spotRepair">-</span></div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript" src="../js/jquery-1.8.3.js"></script>
<script type="text/javascript" src="../js/toast.js"></script>
<script type="text/javascript" src="../js/admin-shell.js"></script>
<script>
  (function () {
    /** 基本参数：读 syssetting，只展示不修改 */
    function loadSetting() {
      fetch('SysSetting/get')
        .then(function (r) { return r.json(); })
        .then(function (s) {
          $('[name=parkingname]').text(s.parkingname || '-');
          $('[name=totalspots]').text((s.totalspots == null ? '-' : s.totalspots) + ' 个');
          $('[name=freeminutes]').text((s.freeminutes == null ? '-' : s.freeminutes) + ' 分钟');
          $('[name=contactphone]').text(s.contactphone || '-');
          $('[name=address]').text(s.address || '-');
          $('[name=updatedAt]').text('更新于 ' + new Date().toLocaleTimeString());
        })
        .catch(function () { toast('设置加载失败', 'err'); });
    }

    /** 车位使用情况：实时统计 parkingspot */
    function loadSpots() {
      fetch('ParkingSpot/grid')
        .then(function (r) { return r.json(); })
        .then(function (list) {
          var free = 0, used = 0, repair = 0;
          (list || []).forEach(function (s) {
            if (s.status === '空闲') {
              free++;
            } else if (s.status === '已占用') {
              used++;
            } else {
              repair++;
            }
          });
          $('[name=spotTotal]').text((list || []).length + ' 个');
          $('[name=spotFree]').text(free + ' 个');
          $('[name=spotUsed]').text(used + ' 个');
          $('[name=spotRepair]').text(repair + ' 个');
        })
        .catch(function () { /* 车位统计失败不影响参数展示 */ });
    }

    $(document).ready(function () {
      bindNav('settings');
      loadSetting();
      loadSpots();
    });
  })();
</script>
</body>
</html>
